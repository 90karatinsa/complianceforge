apiVersion: apps/v1
kind: Deployment
metadata:
  name: oss-licensing-api
  labels:
    app: oss-licensing
    component: api
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: oss-licensing
      component: api
  template:
    metadata:
      labels:
        app: oss-licensing
        component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/alterra/oss-licensing/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: oss-licensing-api-config
            - secretRef:
                name: oss-licensing-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            failureThreshold: 3
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            failureThreshold: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: runtime
              mountPath: /var/run/oss-licensing
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
        - name: runtime
          emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: "node.kubernetes.io/unreachable"
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: oss-licensing-api
  labels:
    app: oss-licensing
    component: api
spec:
  selector:
    app: oss-licensing
    component: api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
