replicaCount: 2

image:
  repository: ghcr.io/alterra/oss-licensing/api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: http

podAnnotations: {}
podLabels: {}

serviceAccount:
  create: false
  name: ""

automountServiceAccountToken: false

configMapName: oss-licensing-api-config
secretName: oss-licensing-secrets

env:
  port: "3000"
extraEnv:
  - name: FEED_CACHE_DIR
    value: /var/lib/atlas/feeds
  - name: EVIDENCE_EXPORT_DIR
    value: /var/lib/atlas/evidence
  - name: COSIGN_PUBLIC_KEY
    value: /var/lib/atlas/cosign/atlas-feed.pub
  - name: AIRGAP_MODE
    value: "true"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  fsGroup: 2000
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

livenessProbe:
  httpGet:
    path: /v1/health
    port: http
  failureThreshold: 3
  periodSeconds: 15
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /v1/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3

startupProbe:
  httpGet:
    path: /v1/health
    port: http
  failureThreshold: 10
  periodSeconds: 5
  timeoutSeconds: 3

volumes:
  - name: tmp
    emptyDir:
      medium: Memory
  - name: runtime
    emptyDir: {}
  - name: feed-cache
    persistentVolumeClaim:
      claimName: atlas-feed-cache
  - name: evidence-packs
    persistentVolumeClaim:
      claimName: atlas-evidence-packs
  - name: cosign-keys
    secret:
      secretName: atlas-cosign-pub

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: runtime
    mountPath: /var/run/oss-licensing
  - name: feed-cache
    mountPath: /var/lib/atlas/feeds
  - name: evidence-packs
    mountPath: /var/lib/atlas/evidence
  - name: cosign-keys
    mountPath: /var/lib/atlas/cosign
    readOnly: true

nodeSelector:
  kubernetes.io/os: linux

affinity: {}

tolerations:
  - key: "node.kubernetes.io/not-ready"
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60
  - key: "node.kubernetes.io/unreachable"
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 60
